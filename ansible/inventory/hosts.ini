[k3s_workers]
k3s-worker-01 ansible_host=10.0.0.12
k3s-worker-02 ansible_host=10.0.0.13
k3s-worker-03 ansible_host=10.0.0.14

[k3s_workers:vars]
ansible_user=flux
ansible_ssh_private_key_file=~/.ssh/id_ed25519_ansible
# Ubuntu 26.04 defaults to sudo-rs; ansible-core 2.20.1 can't parse its prompt.
# Use classic sudo until upstream support lands (ansible/ansible#85837).
ansible_become_exe=sudo.ws
